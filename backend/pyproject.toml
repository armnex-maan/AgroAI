[project]
name = "agroai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "librosa>=0.10",
  "soundfile>=0.12",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "onnxruntime>=1.18",
  "websockets>=12.0",
  "paho-mqtt>=2.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# YAMNet runs on the TFLite interpreter shipped with TensorFlow.
ml = ["tensorflow>=2.16"]
# BirdNET: CC BY-NC-SA 4.0 model — non-commercial use only.
birdnet = ["birdnetlib>=0.17", "resampy>=0.4", "audioread>=3.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
